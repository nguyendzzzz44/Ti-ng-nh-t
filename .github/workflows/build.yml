name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-debug-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
