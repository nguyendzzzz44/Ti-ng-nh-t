name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ✅ Tạo file chấp nhận giấy phép thủ công — CÁCH NÀY CHẮC CHẮN NHẤT
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5d4ffa8e753f60081d2c3" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d975f80fb2f322d0d731b984012d1412bc4d3b46" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install SDK & Build
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-debug-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
          
