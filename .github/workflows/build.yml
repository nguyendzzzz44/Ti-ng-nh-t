name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true   # ✅ SỬA ĐÚNG TÊN Ở ĐÂY

      - name: Extract Android project & Build
        run: |
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-debug-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
