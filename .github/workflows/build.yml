name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ Dùng action chuẩn, không cần tự cài thủ công nữa
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "34.0.0"

      - name: Extract source & Build APK
        run: |
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          
          # Tạo file cấu hình tạm để đồng bộ JVM
          cat > fix-jvm.gradle << 'EOF'
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          echo "apply from: 'fix-jvm.gradle'" >> app/build.gradle.kts
          
          chmod +x gradlew 2>/dev/null || gradle wrapper
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          
