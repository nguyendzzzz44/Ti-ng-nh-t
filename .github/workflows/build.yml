
name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Extract source and Build APK
        run: |
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          cat > fix-jvm.gradle <<'EOF'
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          echo "apply from: 'fix-jvm.gradle'" >> app/build.gradle
          chmod +x gradlew 2>/dev/null || true
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          
