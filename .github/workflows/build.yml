name: Build Kana Master APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ CÀI ANDROID SDK ĐẦY ĐỦ — Bước quan trọng nhất mình thiếu
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Tạo file giấy phép thủ công
      - name: Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5d4ffa8e753f60081d2c3" > "$ANDROID_HOME/licenses/android-sdk-license"

      # ✅ Giải nén & Build — bỏ sdkmanager vì setup-android đã làm rồi
      - name: Build APK
        run: |
          unzip -q KanaMasterAndroid_phone_build.zip
          cd KanaMasterAndroid
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KanaMaster-debug-APK
          path: KanaMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
          
          
          
          
          
